// Script Strafe & Movement
alias +strafes1 "+left;"
alias -strafes1 "-left;"
alias +strafes2 "+right;"
alias -strafes2 "-right;"

alias +strafeleft "+left;"
alias -strafeleft "-left;"
alias +straferight "+right;"
alias -straferight "-right;"

alias _jump.qA2 "+jump;"
alias s.qA2_run "+forward;"
alias s.qA2_pre "+forward;"

alias run_qA2.LJ4 "s.qA2_run;"
alias pre_qA2.LJ4 "s.qA2_pre;"

bind "ALT" "run_qA2.LJ4" //
bind "CAPSLOCK" "pre_qA2.LJ4" //

// Fast Weapons
bind "MWHEELDOWN" "invnext"
bind "MWHEELUP" "invprev"
bind "q" "lastinv"

cl_radartype "1"
cl_headname "1"
cl_gunsmoke "1"
cl_csgoviewmode "1"
cl_weaponlag "1"
cl_gunbubbles "1"
pb_hud "1"
pb_hud_variant "1"

echo "Userconfig Loaded Successfully!"