// ============================================================
// LAUNCHER APPLY MODE - Membaca mp_gamemode dan eksekusi mode
// ============================================================
// Dipanggil dari launcher_state.cfg saat Start Game ditekan.
// ============================================================

// Baca nilai mp_gamemode (0=DM 1=TDM 2=BM 3=Sniper 4=Knife)
// Gunakan alias chain karena CS engine tidak punya if/else

alias _check_mode_0 "_mode_bomb; _sl_mode_bomb"
alias _check_mode_1 "_mode_tdm;  _sl_mode_tdm"
alias _check_mode_2 "_mode_bomb; _sl_mode_bomb"
alias _check_mode_3 "_mode_sniper; _sl_mode_sniper"
alias _check_mode_4 "_mode_knife; _sl_mode_knife"

// Default ke TDM jika mp_gamemode belum di-set
alias _apply_gamemode "_check_mode_1"

// Override alias berdasarkan nilai mp_gamemode yang tersimpan
// (Nilai ini di-set secara otomatis oleh settings.scr/Create Server menu)
// Setiap CVAR_SET_FLOAT("mp_gamemode", N) dari menu akan memperbarui ini
// Note: Xash3D tidak punya dynamic alias override via number, jadi kita
// gunakan menu callback di lobby.cfg untuk memanggil _check_mode_N
echo "[CSPB Mode] Applying game mode from mp_gamemode..."
