// Explicitly remove all persistence badges
// Weapon Badges
touch_removebutton "_w_badge_s*"
touch_removebutton "_s_badge_s*"
touch_removebutton "_m_badge_s*"
touch_removebutton "_e_badge_s*"
touch_removebutton "_p_badge_s*"
touch_removebutton "_weap_equip_status_badge"
touch_removebutton "_main_equip_badge"
touch_removebutton "_persist_equip_badge"

// Character Badges
touch_removebutton "_char_p*"
touch_removebutton "_active_char_*"
touch_removebutton "selected_char_img"

// Other UI
touch_removebutton "_lobby_scroll*"
touch_removebutton "_lobby_select*"
touch_removebutton "_lobby_weapon*"
touch_removebutton "_lobby_secondary*"
touch_removebutton "_lobby_melee*"
touch_removebutton "_lobby_explosive*"
touch_removebutton "_lobby_special*"

// Resume normal HUD
touch_setclientonly 1