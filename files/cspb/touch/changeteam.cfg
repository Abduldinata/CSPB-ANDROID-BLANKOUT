touch_setclientonly 0

alias _erase_frame "touch_removebutton _menu_*; _menu_off; unalias _erase_frame"
alias _menu_off "touch_setclientonly 0"
alias _click "play media/launch_select1.wav; vibrate 30"
alias _click_cnd_back "play media/launch_upmenu1.wav; vibrate 30"

//aliases
alias _clickct "touch_settexture _menu_team touch/team/blue"
alias _clicktr "touch_settexture _menu_team touch/team/red"

alias _blue jointeam 2
alias _okblue "touch_setcommand" "_menu_ok" "_blue"

alias _red jointeam 1
alias _okred "touch_setcommand" "_menu_ok" "_red"


//bg
touch_addbutton "_menu_team" "touch/team/team" "c" 0.280000 0.042667 0.680000 0.938667 255 255 255 255 4

//blue-red
touch_addbutton "_menu_blue" "t" "_clickct; _okblue; " 0.500000 0.213333 0.660000 0.725333 255 255 255 0 4
touch_addbutton "_menu_red" "t" "_clicktr; _okred; " 0.280000 0.213333 0.460000 0.725333 255 255 255 0 4

//ok
touch_addbutton "_menu_ok" "t" "_erase_frame" 0.540000 0.768000 0.640000 0.896000 255 255 255 0 4
touch_addbutton "_menu_cancel" "t" "_erase_frame" 0.340000 0.768000 0.440000 0.896000 255 255 255 0 4
