// Main lobby template for CSPB/Xash touch UI
// Safe as a template: only defines aliases + buttons for one screen

// Routing aliases, connect these to your existing cfg flow
alias _lobby_startgame "_tap_cnd; _remove_lobby; _back_1"
alias _lobby_open_inventory "_tap_cnd; exec addons/neda/default/lobby_menu2.cfg"
alias _lobby_open_mode "_tap_cnd; exec addons/neda/mode/mode.cfg"
alias _lobby_open_map "_tap_cnd; exec addons/neda/mapmode_control.cfg"
alias _lobby_open_team "_tap_cnd; exec addons/neda/default/change_team.cfg"
alias _lobby_open_credit "_tap_cnd; exec addons/neda/blueteam/acidpool/lobby_credit.cfg"
alias _lobby_subscribe_action "_tap_cnd; echo subscribe_button_pressed"

// Base background (replace to main_lobby/bg_main.tga when ready)
touch_addbutton "_lobby_bg_main" "addons/neda/image/png/lobby1.png" "" 0.000000 0.000000 1.000000 1.000000 255 255 255 255 4

// Click zones for primary actions
touch_addbutton "_lobby_btn_start" "" "_lobby_startgame" 0.400000 0.240000 0.600000 0.300000 255 255 255 255 6
touch_addbutton "_lobby_btn_inventory" "" "_lobby_open_inventory" 0.400000 0.320000 0.600000 0.380000 255 255 255 255 6
touch_addbutton "_lobby_btn_mode" "" "_lobby_open_mode" 0.400000 0.400000 0.600000 0.460000 255 255 255 255 6
touch_addbutton "_lobby_btn_map" "" "_lobby_open_map" 0.400000 0.480000 0.600000 0.540000 255 255 255 255 6
touch_addbutton "_lobby_btn_team" "" "_lobby_open_team" 0.400000 0.560000 0.600000 0.620000 255 255 255 255 6
touch_addbutton "_lobby_btn_credit" "" "_lobby_open_credit" 0.400000 0.640000 0.600000 0.700000 255 255 255 255 6
touch_addbutton "_lobby_btn_subscribe" "" "_lobby_subscribe_action" 0.400000 0.720000 0.600000 0.780000 255 255 255 255 6
touch_addbutton "_lobby_btn_exit" "" "_show_confirm_exit" 0.400000 0.800000 0.600000 0.860000 255 255 255 255 6
