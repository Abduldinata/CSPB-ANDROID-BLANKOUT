// Mode Persistence Database
alias _reset_mode_indicator "touch_removebutton _persist_mode_badge"

alias _db_mode_tdm "_reset_mode_indicator; alias _mode_indicator \"exec addons/neda/persist/mode/tdm.cfg\"; _mode_indicator"
alias _db_mode_bm "_reset_mode_indicator; alias _mode_indicator \"exec addons/neda/persist/mode/bm.cfg\"; _mode_indicator"
alias _db_mode_sg "_reset_mode_indicator; alias _mode_indicator \"exec addons/neda/persist/mode/sg.cfg\"; _mode_indicator"
alias _db_mode_sniper "_reset_mode_indicator; alias _mode_indicator \"exec addons/neda/persist/mode/sniper.cfg\"; _mode_indicator"
alias _db_mode_knife "_reset_mode_indicator; alias _mode_indicator \"exec addons/neda/persist/mode/knife.cfg\"; _mode_indicator"

// Default
alias _mode_indicator "_blank"
