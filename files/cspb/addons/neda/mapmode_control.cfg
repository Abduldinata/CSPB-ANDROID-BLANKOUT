// Central Persistence Cleanup
alias _rmv_persist_all "exec addons/neda/persist/cleanup.cfg; _rmv_inv_badges"

// Remove Inventory-specific badges ONLY (for use in Lobby/Team screens)
alias _rmv_inv_badges "exec addons/neda/remove_inv_badges.cfg"

// Remove Map/Mode buttons (called when popup opens)
alias _rmv_mapmode "touch_removebutton _mode_tdm; touch_removebutton _mode_bm; touch_removebutton _select_open_mapf; touch_removebutton _select_close_mapf; touch_removebutton _persist_map_badge; touch_removebutton _persist_mode_badge"

// Add Map/Mode buttons back (called when popup closes)
// Uses persistent _mode_indicator to restore the last selected mode UI (TDM/BM/SG/Sniper/Knife)
alias _add_mapmode "touch_addbutton _select_open_mapf \"\" \"_tap_cnd_click ; rmv_all_stat;_rmv_all_map_cmd2; _rmv_all_map_cmd3; _rmv_all_map_cmd1; _sl_map1\" 0.480000 0.499554 0.550000 0.561998 255 255 255 255 4; touch_addbutton _select_close_mapf \"\" \"_tap_cnd_click ; rmv_all_stat; _rmv_all_map_cmd1;_rmv_all_map_cmd2; _rmv_all_map_cmd3; _rmv_map1\" 0.380000 0.499554 0.440000 0.561998 255 255 255 255 4; _add_indicators"

// Global Indicator Loader (Badges Only)
// Global Indicator Loaders
alias _add_indicators "_rmv_inv_badges; _map_p1_indicator; _mode_p1_indicator"
alias _add_indicators_weap_inv "_map_p1_indicator; _mode_p1_indicator; _weap_p1_indicator; _weap_p2_indicator; _weap_p3_indicator; _weap_p4_indicator; _weap_p5_indicator; _weap_p6_indicator; _weap_p7_indicator; _weap_p8_indicator; _weap_p9_indicator; _weap_p10_indicator; _weap_p11_indicator; _weap_p12_indicator; _weap_p13_indicator; _weap_p14_indicator; _sec_p1_indicator; _sec_p2_indicator; _sec_p3_indicator; _sec_p4_indicator; _melee_p1_indicator; _melee_p2_indicator; _melee_p3_indicator; _melee_p4_indicator; _explosive_p1_indicator; _explosive_p2_indicator; _special_p1_indicator; _special_p2_indicator"

// Specialized Indicator Loader for Character Inventory (Character badges & Selection ONLY)
alias _add_indicators_char_inv "_char_p1_badge; _char_p2_badge; _active_char_selection; _active_char_badge"
