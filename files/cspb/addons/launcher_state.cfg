// ============================================================
// LAUNCHER STATE - CSPB Android Launcher Integration
// Version: 2.0 | Compatible: CSPB Xash3D FWGS
// ============================================================
// Dieksekusi SEBELUM jointeam oleh alias _team_blue/red di lobby.cfg
//
// PENTING: mp_gamemode SUDAH di-set oleh tombol mode di lobby
// (via addons/neda/mode/cmd/*.cfg). File ini TIDAK override mode.
// File ini hanya memastikan bot settings & balance diterapkan.
// ============================================================

// --- BOT SETTINGS ---
// bot_quota diatur oleh user di Create Server menu (settings.scr)
// atau default dari nilai sebelumnya
bot_join_after_player 1
bot_auto_vacate 0

// --- TEAM BALANCE ---
// Biarkan user bergabung tim manapun tanpa batasan saldo
mp_limitteams 0
mp_autoteambalance 0

// --- INFO ---
// pb_user_char_blue / pb_user_char_red di-set oleh alias _team_blue/red
// sebelum exec file ini, jadi C++ (cs_bot_manager) akan membacanya saat AddBot

echo "[CSPB Launcher] Settings applied. Mode: already set by lobby UI."
